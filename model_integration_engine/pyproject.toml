[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "model-integration-engine"
version = "0.3.0a0"
description = "Production-oriented, evidence-first generic AI model integration lifecycle with approval boundaries"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - architecture prototype" }
authors = [{ name = "SAGE Model Integration Engine project" }]
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/model_integration_engine"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
