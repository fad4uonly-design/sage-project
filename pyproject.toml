[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sage"
version = "0.2.0"
description = "SAGE — Smart Autonomous General Engine: a personal AI operating system"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [
    { name = "SAGE Project" }
]
keywords = [
    "ai",
    "personal-assistant",
    "memory",
    "agents",
    "offline-first",
    "operating-system",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "rich>=13.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "tenacity>=8.0",
    "networkx>=3.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "pre-commit>=3.7",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
llm = [
    "openai>=1.30",
    "anthropic>=0.28",
]
ocr = [
    "pytesseract>=0.3",
    "pillow>=10.0",
]
documents = [
    "pypdf>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "markdown>=3.5",
]
web = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
]
all = [
    "sage[dev,docs,llm,ocr,documents,web]",
]

[project.scripts]
sage = "sage.cli:app"

[project.urls]
Homepage = "https://github.com/sage-ai/sage"
Documentation = "https://github.com/sage-ai/sage/docs"
Repository = "https://github.com/sage-ai/sage"

[tool.setuptools.packages.find]
where = ["."]
include = ["sage*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
packages = ["sage"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["sage", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["sage"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
